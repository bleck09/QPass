# =============================================================================
# QPass — dependencias para desarrollo LOCAL (no es el stack de producción, ese
# es docker-compose.yml y lo usa Dokploy).
#
# Levanta solo lo que el backend necesita alrededor: PostgreSQL y MinIO. El
# backend y el frontend se corren a mano (npm run start:dev / npm run dev).
#
#   docker compose -f docker-compose.dev.yml up -d
#
# Coincide con backend/.env:
#   DATABASE_URL  -> localhost:5433
#   S3_ENDPOINT   -> http://localhost:9000   (consola web en http://localhost:9001)
# =============================================================================

volumes:
  qpass_dev_db_data:
  qpass_dev_minio_data:

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qpass
      POSTGRES_PASSWORD: qpass
      POSTGRES_DB: qpass
    ports:
      - "5433:5432"
    volumes:
      - qpass_dev_db_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-qpass-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-qpass-minio-secret}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # consola web
    volumes:
      - qpass_dev_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Crea el bucket al arrancar y sale.
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-qpass-minio} ${S3_SECRET_KEY:-qpass-minio-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-qpass-uploads} &&
      echo 'bucket listo'
      "
    restart: "no"
