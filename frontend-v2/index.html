<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="QPass — control de acceso y billetera para eventos" />
    <title>QPass</title>
    <script>
      // Aplica el tema guardado antes de pintar, para que no haya flash blanco
      // al entrar en modo oscuro (Manual 16, regla 9).
      (function () {
        try {
          var t = localStorage.getItem('qpass_tema');
          if (t === 'dark' || t === 'light') {
            document.documentElement.dataset.theme = t;
          }
        } catch (e) {
          /* localStorage no disponible: se usa el tema del sistema */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
