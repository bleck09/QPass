# =============================================================================
# QPass — stack de producción para Dokploy (Docker Compose).
#
# Servicios: db (PostgreSQL) + backend (NestJS/Prisma) + frontend (build Vite
# servido por nginx, que además hace de proxy del API en /api).
# Las migraciones de Prisma se aplican solas al arrancar el backend.
#
# UN SOLO DOMINIO: el navegador llama a https://<dominio>/api/... y el nginx del
# frontend lo redirige al backend por la red interna. No hace falta subdominio
# para el API ni configurar CORS.
#
# En Dokploy:
#   1. Tipo de app: Compose. Ruta del compose: docker-compose.yml
#   2. Cargar las variables de .env.example en la pestaña "Environment".
#   3. Domains: solo uno -> service "frontend", puerto 80 (ej. qpass.tudominio.com)
#   4. VITE_API_URL se deja en "/api" (mismo origen).
# =============================================================================

networks:
  # La crea Dokploy; conecta el frontend con su Traefik (dominio público).
  dokploy-network:
    external: true
  internal:

volumes:
  qpass_db_data:
  # Objetos de MinIO (fotos, comprobantes, logos...). Antes eran base64 en la BD,
  # después archivos en un volumen del propio backend; ahora viven en un
  # contenedor aparte (minio) para que el backend quede sin estado.
  qpass_minio_data:

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qpass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qpass}
      POSTGRES_DB: ${POSTGRES_DB:-qpass}
    volumes:
      - qpass_db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qpass} -d ${POSTGRES_DB:-qpass}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # MinIO: almacenamiento de objetos (S3 compatible) para las imágenes. Es el
  # "contenedor aparte" — el backend ya no guarda archivos, solo habla S3 con él.
  # Solo en la red interna: nunca se expone al dominio público.
  # ---------------------------------------------------------------------------
  minio:
    # Docker Hub (minio/minio) dejó de servir varias tags viejas de MinIO —
    # quay.io es el mismo release, publicado por MinIO, todavía accesible sin
    # login. Cambiar esto NO toca el volumen qpass_minio_data (tus archivos
    # ya subidos): la imagen es solo el programa que lee/escribe ahí, los
    # datos viven aparte y no se tocan por cambiar de dónde se descarga.
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - qpass_minio_data:/data
    networks:
      - internal
    healthcheck:
      # La imagen de minio trae curl y expone /minio/health/live.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Crea el bucket una vez y sale. Idempotente (--ignore-existing).
  minio-init:
    # Mismo motivo que en el servicio "minio" de arriba: minio/mc en Docker
    # Hub daba "pull access denied" — quay.io es el mismo release.
    image: quay.io/minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        echo 'bucket listo'
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-qpass-uploads}
    networks:
      - internal
    restart: "no"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-qpass}:${POSTGRES_PASSWORD:-qpass}@db:5432/${POSTGRES_DB:-qpass}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRA_EN: ${JWT_EXPIRA_EN:-8h}
      PORT: "4000"
      # Mismo origen (el front pega a /api del propio dominio), pero se deja fijado.
      CORS_ORIGEN: ${CORS_ORIGEN:-*}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Almacenamiento de imágenes: el backend habla S3 con el contenedor `minio`
      # por la red interna (ver backend/src/modules/uploads/s3.client.ts).
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-qpass-uploads}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
    expose:
      - "4000"
    networks:
      internal:
        # Alias único: "backend" a secas colisiona con otras apps de Dokploy
        # que comparten dokploy-network. El nginx del frontend usa este nombre.
        aliases:
          - qpass-backend
    healthcheck:
      # 127.0.0.1 y no "localhost": localhost resuelve a ::1 (IPv6) y Node solo
      # escucha en IPv4, así el healthcheck daba connection refused -> unhealthy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        # Relativo: el front llama al mismo dominio y nginx proxya /api -> backend.
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - internal        # para alcanzar a "backend" en el proxy /api
      - dokploy-network  # para el dominio público vía Traefik
