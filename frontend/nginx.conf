server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El API acepta imágenes en base64 (hasta ~10 MB). Solo aplica si algún día
    # este nginx pasa a hacer de proxy del backend; hoy sirve solo el estático.
    client_max_body_size 12m;

    # SPA: cualquier ruta desconocida cae en index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets con hash en el nombre se pueden cachear agresivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea, para que un deploy nuevo se vea al instante.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
