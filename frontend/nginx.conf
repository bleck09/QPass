server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El API recibe imágenes en base64 (hasta ~10 MB) por este proxy.
    client_max_body_size 12m;

    # --- API: mismo dominio, proxy al backend por la red interna de Docker. ---
    # "/api/auth/login" -> "http://qpass-backend:4000/auth/login" (la barra final
    # en proxy_pass hace que se quite el prefijo /api/). El backend NO tiene
    # prefijo global, por eso hay que sacárselo acá.
    # qpass-backend es el alias de red del servicio "backend" (ver docker-compose):
    # el nombre "backend" a secas colisiona con otras apps en dokploy-network.
    location /api/ {
        proxy_pass http://qpass-backend:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA: cualquier ruta desconocida cae en index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets con hash en el nombre se pueden cachear agresivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea, para que un deploy nuevo se vea al instante.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
