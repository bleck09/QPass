<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="QPass "
    />
    <meta name="color-scheme" content="light dark" />
    <title>QPass </title>
    <script>
      /* Aplica el tema guardado ANTES de pintar, para no ver un flash.
         El tema oscuro es SOLO del panel: la página pública, la del evento y
         las pantallas de cuenta van siempre en claro (ver utils/tema.js). */
      try {
        var ruta = location.pathname.toLowerCase();
        var esPublica = ruta === '/' || ruta.indexOf('/evento/') === 0
          || ruta === '/login' || ruta === '/registrar'
          || ruta === '/recuperar' || ruta === '/completar-perfil';
        var t = esPublica ? 'light' : localStorage.getItem('qpass-tema');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
