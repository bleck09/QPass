# Dependencias para desarrollo LOCAL del backend (no es el stack de producción,
# ese es ../docker-compose.yml y lo usa Dokploy).
#
#   docker compose up -d
#
# Coincide con .env.example:
#   DATABASE_URL -> localhost:5433
#   S3_ENDPOINT  -> http://localhost:9000   (consola web en http://localhost:9001)

services:
  postgres:
    image: postgres:16
    container_name: qpass_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qpass
      POSTGRES_PASSWORD: qpass
      POSTGRES_DB: qpass
    ports:
      - '5433:5432'
    volumes:
      - qpass_postgres_data:/var/lib/postgresql/data

  # Usado por BullMQ (colas de correo, ver C11). El backend arranca sin Redis;
  # solo hace falta cuando se activen las colas.
  redis:
    image: redis:7
    container_name: qpass_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - qpass_redis_data:/data

  # Almacenamiento de imágenes (S3 compatible). En producción es otro contenedor
  # MinIO igual que este (ver ../docker-compose.yml); acá los puertos 9000/9001
  # quedan expuestos para poder abrir la consola web en desarrollo.
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: qpass_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: qpass-minio
      MINIO_ROOT_PASSWORD: qpass-minio-secret
    ports:
      - '9000:9000'   # API S3
      - '9001:9001'   # consola web
    volumes:
      - qpass_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Crea el bucket "qpass-uploads" al arrancar y sale (idempotente).
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 qpass-minio qpass-minio-secret
        mc mb --ignore-existing local/qpass-uploads
        echo 'bucket listo'
    restart: "no"

volumes:
  qpass_postgres_data:
  qpass_redis_data:
  qpass_minio_data:
